<?xml version="1.0" encoding="UTF-8"?>
<!--
  OURCADE wordmark, hand-drawn as a 5x7 pixel font in SVG. Mirrors the
  in-app title-screen treatment: 'OUR' in neon cyan, 'CADE' in neon
  magenta, dark background. Pure rect elements so it renders without
  any font dependency on any device or browser.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 11" width="500" height="110" shape-rendering="crispEdges">
  <rect width="50" height="11" fill="#08080f"/>
  <g transform="translate(2, 2)">
    <!-- OUR — cyan -->
    <g fill="#00f0ff">
      <!-- O at x=0 -->
      <rect x="1" y="0" width="3" height="1"/>
      <rect x="0" y="1" width="1" height="5"/>
      <rect x="4" y="1" width="1" height="5"/>
      <rect x="1" y="6" width="3" height="1"/>

      <!-- U at x=6 -->
      <rect x="6" y="0" width="1" height="6"/>
      <rect x="10" y="0" width="1" height="6"/>
      <rect x="7" y="6" width="3" height="1"/>

      <!-- R at x=12 -->
      <rect x="12" y="0" width="4" height="1"/>
      <rect x="12" y="1" width="1" height="6"/>
      <rect x="16" y="1" width="1" height="2"/>
      <rect x="12" y="3" width="4" height="1"/>
      <rect x="14" y="4" width="1" height="1"/>
      <rect x="15" y="5" width="1" height="1"/>
      <rect x="16" y="6" width="1" height="1"/>
    </g>

    <!-- CADE — magenta, starts after OUR + 1px gap -->
    <g fill="#ff2bd6" transform="translate(20, 0)">
      <!-- C at x=0 -->
      <rect x="1" y="0" width="3" height="1"/>
      <rect x="0" y="1" width="1" height="5"/>
      <rect x="1" y="6" width="3" height="1"/>

      <!-- A at x=6 -->
      <rect x="7" y="0" width="3" height="1"/>
      <rect x="6" y="1" width="1" height="6"/>
      <rect x="10" y="1" width="1" height="6"/>
      <rect x="6" y="3" width="5" height="1"/>

      <!-- D at x=12 -->
      <rect x="12" y="0" width="4" height="1"/>
      <rect x="12" y="1" width="1" height="5"/>
      <rect x="16" y="1" width="1" height="5"/>
      <rect x="12" y="6" width="4" height="1"/>

      <!-- E at x=18 -->
      <rect x="18" y="0" width="5" height="1"/>
      <rect x="18" y="1" width="1" height="6"/>
      <rect x="18" y="3" width="4" height="1"/>
      <rect x="18" y="6" width="5" height="1"/>
    </g>
  </g>
</svg>
