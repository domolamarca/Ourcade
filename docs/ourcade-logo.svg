<?xml version="1.0" encoding="UTF-8"?>
<!--
  OURCADE wordmark — uses the actual Press Start 2P font from Google
  Fonts so it renders identically to the in-app title screen. The
  @import inside the <style> block fetches the font when the SVG is
  embedded via <object> or loaded directly in a browser. When embedded
  via <img>, browsers don't fetch external CSS — so use <object> in
  HTML if you want the font to load every time.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 110" width="600" height="110">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap');
      .wm {
        font-family: 'Press Start 2P', 'Courier New', monospace;
        font-size: 64px;
        letter-spacing: 2px;
      }
    </style>
    <!-- Cyan glow used by OUR -->
    <filter id="cyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Magenta glow used by CADE -->
    <filter id="magentaGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="600" height="110" fill="#08080f"/>

  <text class="wm" x="300" y="78" text-anchor="middle">
    <tspan fill="#00f0ff" filter="url(#cyanGlow)">OUR</tspan><tspan fill="#ff2bd6" filter="url(#magentaGlow)">CADE</tspan>
  </text>
</svg>
